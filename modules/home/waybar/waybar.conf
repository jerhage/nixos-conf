{
  "layer": "top",
  "exclusive": true,
  "passthrough": false,
  "position": "top",

  "modules-left": [
    "niri/workspaces",
    "niri/window",
  ],

  "modules-center": [
    "custom/startmenu",
  ],

  "modules-right": [
    "mpris",
    "group/tray-expander",
    "clock",
    "custom/exit"
  ],

  "group/tray-expander": {
    "orientation": "inherit",
    "drawer": {
      "click-to-reveal": true,
      "transition-right-to-left": true,
      "transition-duration": 600,
      "children-class": "tray-group-item"
    },
    "modules": [
      "custom/expand-icon",
      "pulseaudio",
      "disk",
      "memory",
      "network",
      "cpu",
      "tray",
      "custom/notification",
    ]
  },
  "niri/workspaces": {
    "format": "{name}",
    "current-only": true,
  },
  "wlr/taskbar": {
    "tooltip-format": "{title} | {app_id}",
},

  "clock": {
    "format": " {:%H:%M}",
    "tooltip": true,
    "tooltip-format": "<big>{:%A, %d.%B %Y }</big><tt><small>{calendar}</small></tt>"
  },

  "niri/window": {
    "separate-outputs": false
  },

  "memory": {
    "interval": 5,
    "format": " {}%",
    "tooltip": true,
    "on-click": "ghostty -e btop"
  },

  "cpu": {
    "interval": 5,
    "format": " {usage:2}%",
    "tooltip": true,
    "on-click": "ghostty -e btop"
  },

  "disk": {
    "format": " {free}",
    "tooltip": true
    // "on-click": "ghostty -e sh -c df -h ; read"
  },

  "network": {
    "format-icons": [
      "󰤯",
      "󰤟",
      "󰤢",
      "󰤥",
      "󰤨"
    ],
    "format-ethernet": " {bandwidthDownBits}",
    "format-wifi": " {bandwidthDownBits}",
    "format-disconnected": "󰤮",
    "tooltip": false,
    "on-click": "ghostty -e btop"
  },



  "custom/expand-icon": {
    "format": "",
    "tooltip": false
  },

  "tray": {
    "icon-size": 12,
    "spacing": 12
  },

  "pulseaudio": {
    "format": "{icon} {volume}% {format_source}",
    "format-bluetooth": "{volume}% {icon} {format_source}",
    "format-bluetooth-muted": " {icon} {format_source}",
    "format-muted": " {format_source}",
    "format-source": " {volume}%",
    "format-source-muted": "",
    "format-icons": {
      "headphone": "",
      "hands-free": "",
      "headset": "",
      "phone": "",
      "portable": "",
      "car": "",
      "default": [
        "",
        "",
        ""
      ]
    },
    "on-click": "pavucontrol"
  },

  "custom/exit": {
    "tooltip": false,
    "format": "⏻",
    "on-click": "sleep 0.1 && wlogout"
  },

  "custom/startmenu": {
    "tooltip": false,
    "format": "",
    "on-click": "wofi --show drun"
  },

  "custom/notification": {
    "tooltip": false,
    "format": "{icon}",
    "format-icons": {
      "notification": "<span foreground='red'><sup></sup></span>",
      "none": "",
      "dnd-notification": "<span foreground='red'><sup></sup></span>",
      "dnd-none": "",
      "inhibited-notification": "<span foreground='red'><sup></sup></span>",
      "inhibited-none": "",
      "dnd-inhibited-notification": "<span foreground='red'><sup></sup></span>",
      "dnd-inhibited-none": ""
    },
    "return-type": "json",
    "exec-if": "which swaync-client",
    "exec": "swaync-client -swb",
    "on-click": "swaync-client -t -sw",
    "on-click-right": "swaync-client -d -sw",
    "escape": true
  },

  "battery": {
    "states": {
      "warning": 30,
      "critical": 15
    },
    "format": "{icon} {capacity}%",
    "format-charging": "󰂄 {capacity}%",
    "format-plugged": "󱘖 {capacity}%",
    "format-icons": [
      "󰁺",
      "󰁻",
      "󰁼",
      "󰁽",
      "󰁾",
      "󰁿",
      "󰂀",
      "󰂁",
      "󰂂",
      "󰁹"
    ],
    "on-click": "",
    "tooltip": false
  },

  "mpris": {
    "format": "{player_icon} {dynamic}",
    "format-paused": "{status_icon} <i>{dynamic}</i>",
    "player-icons": {
      "default": "▶",
      "mpv": "🎵"
    },
    "status-icons": {
      "paused": "⏸"
    },
    "ignored-players": [ "chromium" ],
    "max-length": 60
  }
}